name = "oton-api"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://otonimoveis.com,https://www.otonimoveis.com,https://junin1737.github.io,http://127.0.0.1:8787,http://localhost:5500,http://127.0.0.1:5500,http://localhost:4173,http://localhost:3000,null"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "oton-media"

# Segredos (não versionar no Git):
#   npx wrangler secret put TURSO_DATABASE_URL
#   npx wrangler secret put TURSO_AUTH_TOKEN
# Local: use api/.dev.vars
# R2: ative em https://dash.cloudflare.com → R2 → Purchase/Enable (free tier)
# Depois: npx wrangler r2 bucket create oton-media
